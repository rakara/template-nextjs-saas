name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Report dependency audit summary
        run: |
          npm audit --json > audit.json || true
          node -e 'const audit=require("./audit.json"); console.log(JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2)); for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) console.log(`${name}: ${item.severity}; fix=${JSON.stringify(item.fixAvailable)}`)'
      - run: npm run build

      - name: Commit generated npm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: commit npm lockfile [skip ci]"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
            gh workflow run ci.yml --repo "${{ github.repository }}" --ref "${{ github.event.pull_request.head.ref }}"
          fi

  database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - run: supabase db reset
      - run: supabase db lint --local
      - run: supabase stop --no-backup
